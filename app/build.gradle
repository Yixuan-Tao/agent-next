apply plugin: 'com.android.application'

def releaseProps = new Properties()
def releasePropsFile = rootProject.file('private/release-signing.properties')
if (releasePropsFile.exists()) {
    releasePropsFile.withInputStream { releaseProps.load(it) }
}

android {
    namespace 'agent.next.app'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'agent.next.app'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }

    buildFeatures {
        buildConfig false
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('work/signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releasePropsFile.exists()) {
            release {
                storeFile rootProject.file(releaseProps['storeFile'])
                storePassword releaseProps['storePassword']
                keyAlias releaseProps['keyAlias']
                keyPassword releaseProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.debug
        }
        release {
            if (releasePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':capability')
    implementation project(':device-api')
    implementation project(':brain')
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
